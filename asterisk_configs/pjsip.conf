; ==============================================================================
; 🔧 PRODUCTION PJSIP.CONF - COMPLETE NAT TRAVERSAL FIX
; ==============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

external_media_address=34.69.25.186
external_signaling_address=34.69.25.186

local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=127.0.0.0/8

[microsip]
type=endpoint
context=ai-routing
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
auth=microsip_auth
aors=microsip

direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
ice_support=yes

timers=yes
timers_min_se=90
timers_sess_expires=1800
rtp_timeout=120
rtp_timeout_hold=120

[microsip_auth]
type=auth
auth_type=userpass
username=aarit
password=secretpassword

[microsip]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
qualify_timeout=10

[microsip_identify]
type=identify
endpoint=microsip
match=0.0.0.0/0

[neox]
type=endpoint
context=ai-routing
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
aors=neox

direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

rtp_timeout=120
rtp_timeout_hold=120

[neox]
type=aor
contact=sip:113.193.111.116:5060
max_contacts=5
qualify_frequency=30

[neox_identify]
type=identify
endpoint=neox
match=113.193.111.116
