; ==============================================================================
; 🔧 PRODUCTION PJSIP.CONF - COMPLETE NAT TRAVERSAL FIX
; ==============================================================================
; 
; ⚠️  INSTRUCTIONS FOR ARVIND:
;     1. Find your Google Cloud PUBLIC IP by running:  curl ifconfig.me
;     2. Replace every instance of REPLACE_WITH_YOUR_GCP_PUBLIC_IP below
;        with that exact IP address (e.g., 34.55.123.45)
;     3. Copy this file to:  /etc/asterisk/pjsip.conf
;     4. Run:  sudo asterisk -rx "core reload"
;
; ==============================================================================

; ─────────────────────────────────────────────────
; TRANSPORT - The foundation of all SIP networking
; ─────────────────────────────────────────────────
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:15060

; 🚨 THIS IS THE CRITICAL NAT FIX 🚨
; Without these lines, MicroSIP/Zoiper cannot complete the SIP handshake
; and Asterisk will kill the call after exactly 32 seconds.
external_media_address=REPLACE_WITH_YOUR_GCP_PUBLIC_IP
external_signaling_address=REPLACE_WITH_YOUR_GCP_PUBLIC_IP

; Tell Asterisk which subnets are "internal" (Google Cloud uses 10.x.x.x internally)
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16
local_net=127.0.0.0/8


; ─────────────────────────────────────────────────
; MICROSIP / ZOIPER ENDPOINT (The Softphone User)
; ─────────────────────────────────────────────────
[microsip]
type=endpoint
context=ai-routing
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
auth=microsip_auth
aors=microsip

; 🚨 CRITICAL NAT RULES FOR THE ENDPOINT 🚨
; These force all audio to flow through Asterisk (prevents onesided-audio and drops)
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
ice_support=yes

; Session Timers - Prevents silent call drops
timers=yes
timers_min_se=90
timers_sess_expires=1800

; RTP Timeout - Only kill the call if NO audio at all for 120 seconds
; (This prevents premature hangups during long AI thinking pauses)
rtp_timeout=120
rtp_timeout_hold=120


[microsip_auth]
type=auth
auth_type=userpass
username=aarit
password=secretpassword

[microsip]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30
qualify_timeout=10

[microsip_identify]
type=identify
endpoint=microsip
match=0.0.0.0/0


; ─────────────────────────────────────────────────
; NEOX PBX ENDPOINT (Production Trunk - Future Use)
; ─────────────────────────────────────────────────
[neox]
type=endpoint
context=ai-routing
disallow=all
allow=ulaw
allow=alaw
transport=transport-udp
aors=neox

direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes

rtp_timeout=120
rtp_timeout_hold=120

[neox]
type=aor
max_contacts=5
qualify_frequency=30

[neox_identify]
type=identify
endpoint=neox
match=113.193.111.116
